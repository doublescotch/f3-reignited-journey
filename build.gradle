plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

// Build hors OneDrive: evite les verrous de synchronisation
layout.buildDirectory = file("C:/mcbuild/f3-reignited-journey")

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            mods { f3reignitedjourney { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'f3reignitedjourney.refmap.json'
    config 'f3reignitedjourney.mixins.json'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Integrations OPTIONNELLES: compileOnly seulement.
    // Les noms de CLASSES sont identiques entre mappings officiels et production,
    // et les methodes appelees appartiennent a ces mods (jamais remappees) — donc
    // les appels compiles ici resolvent tels quels en production.
    // Chaque usage est isole dans une classe dediee, chargee uniquement si le mod
    // correspondant est present (ModList) => aucun NoClassDefFoundError sans eux.
    compileOnly fg.deobf('maven.modrinth:reignited-hud:LgYSKthd')  // ID de version: 13 fichiers portent le numero 1.1.0
    compileOnly fg.deobf('maven.modrinth:tough-as-nails:9.2.0.171')
    compileOnly fg.deobf('maven.modrinth:thirst-was-taken:1.20.1-1.4.0')
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'f3reignitedjourney',
                'Specification-Vendor'  : 'Hell_Kaiser',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'Hell_Kaiser',
                'MixinConfigs'          : 'f3reignitedjourney.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// Builds reproductibles: meme source => meme jar, octet pour octet.
// Sans cela Gradle horodate chaque entree du zip et deux compilations du meme
// code donnent des empreintes differentes — poison pour un modpack indexe.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
